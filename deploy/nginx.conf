# Nginx 反向代理：给虚拟机上的服务加一层（HTTPS 终止 + 转发 SSE）
# 放到 /etc/nginx/conf.d/schedule-agent.conf，然后 nginx -t && systemctl reload nginx
#
# SSE 关键点：必须关掉 proxy_buffering，否则流式回复会被缓冲成一整块，
# 前端就看不到打字机效果了。WebSocket 需要 Upgrade 头。

upstream schedule_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name your-domain.example;   # ← 改成你的域名

    client_max_body_size 2m;

    # ---- REST / SSE ----
    location /api/ {
        proxy_pass http://schedule_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 必需：关闭缓冲 + 长超时
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- WebSocket（实时提醒推送）----
    location /api/ws {
        proxy_pass http://schedule_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # 健康检查（可给负载均衡用）
    location = /healthz {
        proxy_pass http://schedule_api/api/health;
        access_log off;
    }
}
